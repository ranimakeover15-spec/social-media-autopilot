services:
  - type: worker
    name: rani-makeover-telegram-bot
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GDRIVE_TOKEN_PICKLE_B64
        sync: false
      - key: YOUTUBE_TOKEN_PICKLE_B64
        sync: false
      - key: YOUTUBE_CLIENT_SECRETS_B64
        sync: false
