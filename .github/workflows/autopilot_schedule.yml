name: 👑 Rani Makeover 24/7 Social Media Autopilot Schedule

on:
  schedule:
    # 09:00 AM IST = 03:30 AM UTC
    - cron: '30 3 * * *'
    # 02:00 PM IST = 08:30 AM UTC
    - cron: '30 8 * * *'
    # 07:00 PM IST = 13:30 PM UTC
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  publish_scheduled_slot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Autonomous Scheduled Ingestion & Publishing
        run: |
          python core/telegram_priority_unified_pipeline.py
