name: 👑 Rani Makeover 24/7 Cloud Autopilot Pipeline

on:
  schedule:
    # 09:00 AM IST = 03:30 AM UTC
    - cron: '30 3 * * *'
    # 02:00 PM IST = 08:30 AM UTC
    - cron: '30 8 * * *'
    # 07:00 PM IST = 13:30 PM UTC
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_autopilot_cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Restore Cloud Credentials from GitHub Secrets
        env:
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          GDRIVE_TOKEN_BASE64: ${{ secrets.GDRIVE_TOKEN_BASE64 }}
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
        run: |
          if [ -n "$TOKEN_PICKLE_BASE64" ]; then
            echo "$TOKEN_PICKLE_BASE64" | base64 -d > token.pickle
          fi
          if [ -n "$GDRIVE_TOKEN_BASE64" ]; then
            echo "$GDRIVE_TOKEN_BASE64" | base64 -d > gdrive_token.pickle
          fi
          if [ -n "$INSTAGRAM_SESSION" ]; then
            echo "$INSTAGRAM_SESSION" > instagram_session.json
          fi

      - name: 🚀 Run 100% Cloud-Native GDrive Stream & Publishing Pipeline
        run: |
          python core/cloud_gdrive_pipeline.py

      - name: 💾 Deduplication Persistence (Git Auto-Commit History)
        run: |
          git config --global user.name "Autopilot-Bot"
          git config --global user.email "bot@autopilot.local"
          git add logs/
          git commit -m "Update deduplication history [skip ci]" || true
          git push || true
